<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Content Security Policy (CSP) ────────────────────────────────── -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https: http://localhost:*; frame-src 'self' https://accounts.google.com;" />

    <!-- ── Google Tag (gtag.js) — Google Analytics 4 ────────────────────── -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      // Configure GA4 with send_page_view: false so React Router manages SPA page views
      gtag('config', '%VITE_GA_MEASUREMENT_ID%', {
        send_page_view: false
      });
    </script>

    <!-- ── Microsoft Clarity (Heatmaps & Session Recording) ──────────────── -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xuzwyexjo7");
    </script>

    <!-- ── Favicon ──────────────────────────────────────────────────────── -->
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── PWA / Browser Identity ───────────────────────────────────────── -->
    <meta name="theme-color" content="#0b1329" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="NQTCoder" />
    <meta name="generator" content="Vite + React" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- ── SEO Fallback (overridden per-page by react-helmet-async) ──────── -->
    <title>NQTCoder — TCS NQT Coding Practice Platform</title>
    <meta name="description" content="Practice placement coding questions, take proctored mock tests, and track your progress with NQTCoder. Prepare for TCS NQT, Infosys, Wipro, Cognizant, and more." />
    <meta name="keywords" content="NQT coder, placement coding, TCS NQT practice, coding interview preparation, mock test, leaderboard, C++, Java, Python, competitive programming" />
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />
    <meta name="author" content="NQTCoder Team" />

    <!-- ── Open Graph (fallback; overridden per-page) ───────────────────── -->
    <meta property="og:site_name"   content="NQTCoder" />
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://www.nqtcoder.dev/" />
    <meta property="og:title"       content="NQTCoder — Placement Coding Practice Platform" />
    <meta property="og:description" content="Practice placement coding questions, take proctored mock tests, and track your progress. Prepare for TCS NQT, Infosys, Wipro & more." />
    <meta property="og:image"       content="https://www.nqtcoder.dev/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="NQTCoder — Placement Coding Practice Platform" />
    <meta property="og:locale"      content="en_IN" />

    <!-- ── Twitter Card (fallback; overridden per-page) ─────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@nqtcoder" />
    <meta name="twitter:title"       content="NQTCoder — TCS NQT Coding Practice Platform" />
    <meta name="twitter:description" content="Practice placement coding questions, take proctored mock tests, and track your progress. Prepare for TCS NQT, Infosys, Wipro & more." />
    <meta name="twitter:image"       content="https://www.nqtcoder.dev/og-image.png" />
    <meta name="twitter:image:alt"   content="NQTCoder — TCS NQT Coding Practice Platform" />

    <!-- ── Fonts ────────────────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- ── Base JSON-LD: WebSite + Organization ─────────────────────────── -->
    <!-- Overridden/extended per-page by react-helmet-async -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.nqtcoder.dev/#website",
          "url": "https://www.nqtcoder.dev/",
          "name": "NQTCoder",
          "description": "Placement coding practice platform for TCS NQT, Infosys, Wipro and more.",
          "inLanguage": "en-IN",
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.nqtcoder.dev/practice?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://www.nqtcoder.dev/#organization",
          "name": "NQTCoder",
          "url": "https://www.nqtcoder.dev/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://www.nqtcoder.dev/og-image.png",
            "width": 1200,
            "height": 630
          },
          "sameAs": [
            "https://github.com/kumar-veerendra/NQTCoder"
          ],
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "veerendrakumartmsl@gmail.com",
            "contactType": "customer support"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="bg-darkBg text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
